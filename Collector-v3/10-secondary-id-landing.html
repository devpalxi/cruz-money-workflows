<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secondary Identification</title>
<style>
  :root{
    --bg:#eef0f3;
    --panel:#ffffff;
    --field-bg:#f4f5f8;
    --field-border:#dcdfe6;
    --field-border-focus:#4a4a9e;
    --text-primary:#1f2233;
    --text-secondary:#6b7080;
    --brand:#38366e;
    --accent:#2E2F7A;
    --accent-hover:#24255f;
    --success:#1e7d4b;
    --success-hover:#166139;
    --radius:10px;
    --gap-xs:6px;
    --gap-sm:10px;
    --gap-md:16px;
    --gap-lg:24px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text-primary);
  }
  .app{
    display:flex; max-width:1080px; margin:0 auto;
    padding:32px 24px 64px; gap:56px; position:relative;
  }
  .close-btn{
    position:absolute; top:0; right:0;
    background:none; border:none; cursor:pointer;
    color:var(--text-primary); padding:6px; border-radius:8px;
  }
  .close-btn:hover{ background:#e2e3ea; }

  .stepper{ width:220px; flex-shrink:0; padding-top:6px; }
  .step{ display:flex; align-items:center; gap:12px; position:relative; padding-bottom:26px; }
  .step:last-child{padding-bottom:0;}
  .step::before{
    content:''; position:absolute; left:9px; top:22px;
    width:2px; height:calc(100% - 6px); background:#d7d9e2;
  }
  .step:last-child::before{display:none;}
  .step-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid #c7c9d6; background:#fff; flex-shrink:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
  }
  .step.active .step-dot{
    border-color:var(--brand); background:var(--brand);
    box-shadow:0 0 0 3px rgba(56,54,110,0.15);
  }
  .step.done .step-dot{ border-color:var(--brand); background:var(--brand); }
  .step-dot svg{ display:none; color:#fff; }
  .step.done .step-dot svg{ display:block; }
  .step-label{ font-size:14.5px; color:var(--text-secondary); font-weight:600; }
  .step.active .step-label, .step.done .step-label{ color:var(--brand); }

  .main{ flex:1; min-width:0; max-width:680px; }
  h1{ font-size:28px; font-weight:800; color:var(--brand); margin:0 0 22px; }
  .content-card{
    background:#fff;
    border:1px solid #e2e3ea;
    border-radius:14px;
    padding:24px 26px;
  }

  .info-banner{
    background:#eef1fb;
    border:1px solid #d8ddf3;
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .info-banner-title{ font-size:15.5px; font-weight:800; color:var(--brand); margin:0 0 6px; }
  .info-banner-text{ font-size:14px; color:#3d3d78; line-height:1.55; margin:0; }

  .skip-card{
    display:flex; align-items:center; gap:12px;
    background:#fff;
    border:1px solid var(--field-border);
    border-radius:10px;
    padding:15px 18px;
    margin-bottom:22px;
    cursor:pointer;
    font-size:15px; font-weight:600; color:var(--text-primary);
  }
  .skip-card input{
    width:20px; height:20px; accent-color:#1e7d4b;
    flex-shrink:0; cursor:pointer;
  }

  button.action-btn{
    width:100%;
    height:46px;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:700;
    border:none;
    cursor:pointer;
    font-family:inherit;
    color:#fff;
    background:var(--accent);
    transition:background .12s;
  }
  button.action-btn:hover{ background:var(--accent-hover); }
  button.action-btn:disabled{ background:#c3c2e0; cursor:not-allowed; }

  button.action-btn:focus-visible, .skip-card:focus-visible, .close-btn:focus-visible{
    outline:3px solid #2e6fdb; outline-offset:2px;
  }

  @media (max-width:720px){
    .app{ flex-direction:column; gap:24px; padding:20px 16px 48px; }
    .stepper{ width:100%; }
  }
</style>
</head>
<body>

<div class="app">
  <button class="close-btn" aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>

  <nav class="stepper" aria-label="Payout creation steps">
    <div class="step done"><div class="step-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="step-label">New Payout Details</div></div>
    <div class="step done"><div class="step-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="step-label">Payment Breakdown</div></div>
    <div class="step done"><div class="step-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="step-label">Email Address</div></div>
    <div class="step done"><div class="step-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></div><div class="step-label">Primary ID Document</div></div>
    <div class="step active"><div class="step-dot"></div><div class="step-label">Secondary ID (Optional)</div></div>
    <div class="step"><div class="step-dot"></div><div class="step-label">Bank Account</div></div>
    <div class="step"><div class="step-dot"></div><div class="step-label">Summary</div></div>
    <div class="step"><div class="step-dot"></div><div class="step-label">Approval</div></div>
  </nav>

  <main class="main">
    <h1>Secondary Identification (Optional)</h1>

    <div class="content-card">
    <div class="info-banner">
      <p class="info-banner-title">Secondary ID helps verify your identity</p>
      <p class="info-banner-text">You can provide a Medicare card as additional verification, or skip this step if needed.</p>
    </div>

    <label class="skip-card" id="skipCard">
      <input type="checkbox" id="skipCheckbox" />
      <span>Skip secondary ID verification</span>
    </label>

    <button type="button" class="action-btn" id="actionBtn">Medicare Card</button>
    </div>
  </main>
</div>

<script>
  const skipCheckbox = document.getElementById('skipCheckbox');
  const skipCard = document.getElementById('skipCard');
  const actionBtn = document.getElementById('actionBtn');

  function updateState(){
    const skipped = skipCheckbox.checked;
    actionBtn.textContent = skipped ? 'Continue Without Secondary ID' : 'Medicare Card';
  }

  skipCheckbox.addEventListener('change', updateState);

  actionBtn.addEventListener('click', ()=>{
    if(skipCheckbox.checked){
      // Continue without secondary ID — in the full app this advances to Bank Account.
      // Bank Account screen isn't built yet in this prototype, so we confirm the action here instead.
      actionBtn.textContent = 'Continuing to Bank Account…';
      actionBtn.disabled = true;
      skipCheckbox.disabled = true;
    } else {
      // Go to Medicare Card detail form
      window.location.href = '11-secondary-id-medicare-detail.html';
    }
  });
</script>

</body>
</html>
